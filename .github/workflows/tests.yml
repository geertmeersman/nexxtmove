name: "Tests 🧪"

on:
  push:
    branches: ["main"]
    paths: ["**.py", "custom_components/**/frontend/*.js"]
  pull_request:
    branches: ["main"]
    paths: ["**.py", "custom_components/**/frontend/*.js"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  card:
    name: "card (syntax & registration)"
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️　Checkout the repository
        uses: actions/checkout@v4

      - name: 🟩　Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦　Install jsdom
        run: npm install jsdom

      - name: ✅　Syntax check
        run: node --check custom_components/nexxtmove/frontend/nexxtmove-device-card.js

      - name: ✅　customElements registration check
        run: |
          node -e "
            const {JSDOM} = require('jsdom');
            const dom = new JSDOM('', {url:'http://localhost'});
            globalThis.window = dom.window;
            globalThis.document = dom.window.document;
            globalThis.HTMLElement = dom.window.HTMLElement;
            globalThis.customElements = dom.window.customElements;
            globalThis.CustomEvent = dom.window.CustomEvent;
            require('./custom_components/nexxtmove/frontend/nexxtmove-device-card.js');
            const cards = dom.window.customCards;
            const card = cards?.find(c => c.type === 'nexxtmove-device-card');
            if (!card) { console.error('nexxtmove-device-card not found in customCards'); process.exit(1); }
            if (typeof dom.window.customElements.get('nexxtmove-device-card') !== 'function') { console.error('nexxtmove-device-card not defined as custom element'); process.exit(1); }
            if (typeof dom.window.customElements.get('nexxtmove-device-card-editor') !== 'function') { console.error('nexxtmove-device-card-editor not defined as custom element'); process.exit(1); }
            console.log('OK: nexxtmove-device-card registered correctly');
          "
